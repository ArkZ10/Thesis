model:
  encoder_name: /root/Thesis/VAE_Training/models/Qwen3-4B-Base
  decoder_name: /root/Thesis/VAE_Training/models/Qwen3-8B-Base
  num_latents: 6
  latent_dim: 2560
  train_encoder_lm: true
  train_encoder_queries: true
  train_encoder_heads: true
  train_decoder_lm: false
  train_decoder_adapter: true
  sample_posterior: true
  extra_noise_std: 0.0
  encoder_mask_mode: hybrid
  decoder_mask_mode: hybrid
  position_mode: pad_skip
  gradient_checkpointing: true
  ce_fp32: false
  ce_chunk_tokens: 0
train:
  lr: 2.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  kl_weight: 1.0e-5
  seed: 42
  micro_batch_size: 16
  max_tokens: 128
  epochs: 3
  warmup_steps: 100
  max_grad_norm: 1.0
  purpose: Question-disjoint larger-model pilot; no automatic extension

data:
  directory: /root/Thesis/VAE_Training/data/processed/vae-large-comparable-v1
  max_tokens: 128
  test_used: false
evaluation:
  decode_batch_size: 16
  max_new_tokens: 160
  train_sample: 128
  control_sample: 64
