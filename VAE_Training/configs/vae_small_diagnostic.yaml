# Small-model codec diagnostic. This is not the full-size LaDiR run.
model:
  encoder_name: /root/Thesis/VAE_Training/models/Qwen3-0.6B-Base
  decoder_name: /root/Thesis/VAE_Training/models/Qwen3-0.6B-Base
  num_latents: 6
  latent_dim: 1024
  train_encoder_lm: true
  train_encoder_queries: true
  train_encoder_heads: true
  train_decoder_lm: false
  train_decoder_adapter: true
  encoder_mask_mode: hybrid
  decoder_mask_mode: hybrid
  position_mode: pad_skip
  sample_posterior: true
  extra_noise_std: 0.0
  logvar_clamp: [-30.0, 20.0]
  ce_fp32: true
  ce_chunk_tokens: 32
  gradient_checkpointing: true
data:
  path: null  # Set to the saved 16-train/16-dev manifest by the runner.
  tokenizer: /root/Thesis/VAE_Training/models/Qwen3-0.6B-Base
  language: Math
  max_tokens: 64
  split_seed: null
  cache_path: null
  num_workers: 0
train:
  output_dir: null  # Set to the isolated diagnostic run directory.
  seed: 42
  micro_batch_size: 4
  grad_accum: 1
  epochs: 200
  max_steps: 400
  lr: 1.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.95]
  lr_scheduler: constant
  warmup_steps: 10
  max_grad_norm: 1.0
  kl_weight: 1.0e-5
  mixed_precision: bf16
  dtype: bfloat16
  eval_every: 50
  eval_batches: 4
  log_every: 10
  save_every: 0
  keep_last: 2
  export_weights: true
  resume_from: null
  num_workers: 0
wandb:
  enabled: false
