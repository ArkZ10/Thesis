[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dllm*"]

[project]
name = "dllm"
version = "0.1.0"
description = "dLLM: Simple Diffusion Language Modeling"
requires-python = ">=3.10"
dependencies = [
    "transformers==4.57.0",
    "accelerate==1.11.0",
    "deepspeed==0.18.0",
    "datasets==4.2.0",
    "sentencepiece==0.2.0",
    "torchmetrics",
    "wandb",
    "tqdm",
    "rich",
    "lm_eval==0.4.9.2",
]

[tool.black]
line-length = 88
